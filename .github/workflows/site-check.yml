name: Check dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate dashboard data
        run: |
          python3 -m json.tool dist/data/hotspots.json >/dev/null
          python3 scripts/validate_topcase.py

      - name: Check required site files
        run: |
          test -f dist/index.html
          test -f dist/data/hotspots.json

