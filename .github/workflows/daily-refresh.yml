name: Daily automotive refresh

on:
  schedule:
    # GitHub Actions cron uses UTC. 01:00 UTC = 09:00 Asia/Shanghai.
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-automotive-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect and publish dashboard data
        env:
          TZ: Asia/Shanghai
          WEIBO_COLLECTOR_URL: ${{ secrets.WEIBO_COLLECTOR_URL }}
          XIAOHONGSHU_COLLECTOR_URL: ${{ secrets.XIAOHONGSHU_COLLECTOR_URL }}
          DOUYIN_COLLECTOR_URL: ${{ secrets.DOUYIN_COLLECTOR_URL }}
        run: ./scripts/run_daily.sh

      - name: Commit changed data
        run: |
          if git diff --quiet -- dist/data data/staging data/last_good dist/assets/covers; then
            echo "No dashboard data changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data data/staging data/last_good dist/assets/covers
          git commit -m "Update daily automotive radar"
          git push
